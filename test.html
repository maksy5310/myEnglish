<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>百词斩 KET - 单元测试</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; background:#f5f5f5; color:#333; padding:20px; }
  h1 { font-size:22px; margin-bottom:4px; }
  .sub { font-size:13px; color:#888; margin-bottom:20px; }
  #summary { display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
  .s-card { background:#fff; border-radius:10px; padding:14px 20px; box-shadow:0 1px 4px rgba(0,0,0,.06); text-align:center; min-width:100px; }
  .s-card .num { font-size:28px; font-weight:800; }
  .s-card .lbl { font-size:12px; color:#888; margin-top:2px; }
  .s-pass .num { color:#41C28D; }
  .s-fail .num { color:#E85D5D; }
  .s-total .num { color:#333; }
  .s-rate .num { color:#6B4EFF; }
  #results { background:#fff; border-radius:10px; box-shadow:0 1px 4px rgba(0,0,0,.06); overflow:hidden; }
  .suite { border-bottom:1px solid #eee; }
  .suite:last-child { border-bottom:none; }
  .suite-head { padding:12px 16px; background:#f9f9f9; font-weight:700; font-size:15px; display:flex; align-items:center; gap:8px; cursor:pointer; }
  .suite-head .icon { font-size:16px; }
  .suite-head .count { font-size:12px; color:#888; font-weight:400; margin-left:auto; }
  .case { padding:8px 16px 8px 40px; font-size:13px; display:flex; align-items:center; gap:8px; border-top:1px solid #f5f5f5; }
  .case .status { font-size:14px; width:20px; text-align:center; }
  .case.pass .status { color:#41C28D; }
  .case.fail .status { color:#E85D5D; }
  .case .name { flex:1; }
  .case .detail { font-size:12px; color:#E85D5D; margin-left:8px; }
  .actions { margin-bottom:20px; }
  .btn { background:#6B4EFF; color:#fff; border:none; padding:10px 24px; border-radius:8px; font-size:14px; cursor:pointer; }
  .btn:hover { background:#5a3fdf; }
  .btn.sec { background:#fff; color:#6B4EFF; border:2px solid #6B4EFF; }
  #app { display:none; }
</style>
</head>
<body>
<h1>🌿 百词斩 KET 词汇 - 单元测试</h1>
<div class="sub">覆盖单词数据、SM-2算法、学习计划、组合链路、错词本、搜索、字母分组等核心功能</div>

<div class="actions">
  <button class="btn" onclick="runAllTests()">运行全部测试</button>
  <button class="btn sec" onclick="location.reload()">重新运行</button>
</div>

<div id="summary"></div>
<div id="results"></div>

<div id="app"></div>
<script src="words.js"></script>
<script src="app.js"></script>
<script src="test.js"></script>
</body>
</html>
